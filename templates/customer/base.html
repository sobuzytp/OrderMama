{% load static %}<!doctype html>
<html lang="bn" data-theme="light" style="--primary: #E85D04; --secondary: #FFF6EC;">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{% block title %}OrderMama{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anek+Bangla:wght@500;600;700;800&family=Hind+Siliguri:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="{% static 'css/customer.css' %}">
  {% block head %}{% endblock %}
</head>
<body class="{% block bodyclass %}site-page{% endblock %}">
  {% block body %}{% endblock %}
  <script src="https://unpkg.com/lucide@0.451.0/dist/umd/lucide.min.js"></script>
  <script>try { window.lucide && lucide.createIcons(); } catch (e) {}</script>
  {% block scripts %}{% endblock %}
</body>
</html>
