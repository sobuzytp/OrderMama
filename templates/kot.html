{% extends "base.html" %}{% load static %}
{% block title %}KOT — {{ restaurant.name }}{% endblock %}
{% block content %}
<div class="page-heading">
  <div><div class="eyebrow">LIVE KITCHEN</div><h1>Kitchen Order Ticket</h1></div>
  <div>
    <button type="button" id="sound-toggle" class="btn secondary-btn">🔕 শব্দ চালু করুন</button>
    <span id="live-state" class="badge">…</span>
  </div>
</div>
<div id="board" data-url="{% url 'live_feed' restaurant.slug %}" data-poll="{{ poll_ms }}" data-ws="{{ restaurant.slug }}">
  {% include "partials/kot_board.html" %}
</div>
{% endblock %}
{% block scripts %}<script src="{% static 'kot.js' %}"></script>{% endblock %}
