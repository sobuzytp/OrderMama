<!doctype html>
<html lang="bn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>{% block title %}সমস্যা · OrderMama{% endblock %}</title>
  <style>
    :root{--bg:#fff8f0;--surface:#fff;--ink:#1f2430;--muted:#6b7280;--primary:#e85d04;--border:#f0e2d4}
    @media (prefers-color-scheme: dark){
      :root{--bg:#14161b;--surface:#1c1f26;--ink:#f3f4f6;--muted:#9aa3b2;--border:#2c313c}
    }
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;
      background:var(--bg);color:var(--ink);
      font-family:"Hind Siliguri","Noto Sans Bengali",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.7}
    .card{width:100%;max-width:520px;background:var(--surface);border:1px solid var(--border);
      border-radius:20px;padding:clamp(24px,6vw,40px);text-align:center;box-shadow:0 16px 40px rgba(15,23,42,.08)}
    .code{font-size:clamp(40px,12vw,64px);font-weight:800;color:var(--primary);line-height:1;letter-spacing:.04em}
    h1{font-size:clamp(19px,4.4vw,24px);margin:14px 0 6px}
    p{margin:0 0 8px;color:var(--muted);font-size:15px}
    .actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:22px}
    .btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 22px;
      border-radius:12px;text-decoration:none;font-weight:600;font-size:15px;border:1px solid var(--border);
      color:var(--ink);background:var(--surface)}
    .btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
    .ref{margin-top:20px;font-size:12px;color:var(--muted);word-break:break-all}
    .hint{font-size:13px;opacity:.85;margin-top:2px}
    @media (max-width:420px){.btn{flex:1 1 100%}}
  </style>
</head>
<body>
  <main class="card">
    <div class="code">{% block code %}500{% endblock %}</div>
    <h1>{% block heading %}কিছু একটা ভুল হয়েছে{% endblock %}</h1>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
